# The files to be embedded must be visible to build_runner, otherwise it
# cannot detect changes to their content and the generated code becomes
# outdated. 'data/**' is not included in the default sources, so it is
# declared here explicitly.
#
# Note that specifying 'sources' replaces the default list instead of
# extending it, so the other directories must also be listed.
targets:
  $default:
    sources:
      - data/**
      - lib/**
      - pubspec.yaml
      - $package$
